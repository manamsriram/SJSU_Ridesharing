# In-cluster Redis pod — NOT deployed (using Upstash free tier instead).
# To activate: remove the block-comment markers and apply:
#   kubectl apply -f k8s-manifests/redis.yaml
# Then remove REDIS_URL from configmap (the routing-service default already
# points to redis://redis:6379 inside the cluster).

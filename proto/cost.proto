syntax = "proto3";
package lessgo.cost;
import "common.proto";

message CostCalculateRequest {
  lessgo.common.GeoPoint origin = 1;
  lessgo.common.GeoPoint destination = 2;
  int32 num_riders = 3;
  string trip_id = 4;
}

message CostBreakdown {
  double base_price = 1;
  double distance_miles = 2;
  double price_per_mile = 3;
  double total_trip_cost = 4;
  double price_per_rider = 5;
}

message CostCalculateResponse {
  double max_price = 1;
  CostBreakdown breakdown = 2;
}

message TripSettleRequest {
  string trip_id = 1;
}

message RiderSettlement {
  string rider_id = 1;
  string booking_id = 2;
  double amount = 3;
}

message TripSettleResponse {
  string trip_id = 1;
  double total_cost = 2;
  double driver_earnings = 3;
  repeated RiderSettlement riders = 4;
}

service CostService {
  rpc CalculateCost(CostCalculateRequest) returns (CostCalculateResponse);
  rpc SettleTrip(TripSettleRequest) returns (TripSettleResponse);
}

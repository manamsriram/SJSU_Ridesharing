syntax = "proto3";
package lessgo.routing;
import "common.proto";

message RouteCalculateRequest {
  lessgo.common.GeoPoint origin = 1;
  lessgo.common.GeoPoint destination = 2;
}

message RouteCalculateResponse {
  double distance_meters = 1;
  double distance_miles = 2;
  double duration_seconds = 3;
  string polyline = 4;
}

service RoutingService {
  rpc CalculateRoute(RouteCalculateRequest) returns (RouteCalculateResponse);
}

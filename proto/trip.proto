syntax = "proto3";
package lessgo.trip;

message GetTripRequest {
  string trip_id = 1;
}

message TripResponse {
  string trip_id = 1;
  string driver_id = 2;
  string status = 3;
  int32 available_seats = 4;
  string raw_json = 5;
}

service TripService {
  rpc GetTrip(GetTripRequest) returns (TripResponse);
}
